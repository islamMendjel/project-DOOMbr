name: Build and Deploy DOOM to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download and verify Freedoom game assets
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Verify build outputs
        run: |
          echo "Verifying site structure in docs/..."
          test -f docs/index.html && echo "✓ index.html found"
          test -f docs/engine/chocolate-doom.js && echo "✓ chocolate-doom.js found"
          test -f docs/engine/chocolate-doom.wasm && echo "✓ chocolate-doom.wasm found"
          test -f docs/engine/default.cfg && echo "✓ default.cfg found"
          test -f docs/wads/freedoom1.wad && echo "✓ freedoom1.wad found"
          test -f docs/wads/freedoom2.wad && echo "✓ freedoom2.wad found"
          echo "Docs folder listing:"
          ls -lh docs/ docs/engine/ docs/wads/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
